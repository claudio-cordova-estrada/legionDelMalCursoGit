name: Comunicador de la legión

on: #push
    workflow_dispatch:
      inputs: 
        villano:
          description: "¿Qué villano envía el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Magneto
            - Joker
            - Mystique
            - Brainiac
        
        mensaje:
          description: "Mensaje para el consejo"
          required: true
          default: "La misión fue un éxito"

        prioridad:
          description: "Nivel de prioridad"
          required: true
          type: choice
          options:
            - 🟢 Normal
            - 🟡 Alta
            - 🔴 Crítica

        cow-character:
          description: "cow character"
          required: true
          type: choice
          options:
            - eyes
            - cake
            - cat
            - yasuna_02
            - nyan
jobs:
    transmitir-mensaje:
        runs-on: ubuntu-latest

        steps:
            - name: instalar el transmisor de la legión
              run: sudo apt-get install -y cowsay

            - name: Imprimir inputs
              run: |
                echo "============================"
                echo "Transmisión interceptada"
                echo "============================"
                echo "De: ${{ inputs.villano }}"
                echo ""
                echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
                echo "---- mensaje ----"
                cowsay -f "${{ inputs.cow-character }}" "${{ inputs.mensaje }}"
                echo ""
                echo "${{ inputs.villano }}"
                echo ""