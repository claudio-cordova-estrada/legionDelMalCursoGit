name: Acceso a la fortaleza prohibida

on: #push
    workflow_dispatch:

jobs:
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la fortaleza
              run: |
                echo "Agente ${{ github.actor }} llega a la fortaleza"
                echo ""
                echo "Buscar los archivos de la legión"
                ls -la
                echo ""
                echo "❌ Pero qué pasó? No hay nada"
            - name: Brainiac desbloquea la boveda
              uses: actions/checkout@v4 

            - name: Ahora sí se verán los planes
              run: |
                ls -la
                echo "✅ Funciona!!!"
                echo ""
                echo "Villanos:"
                ls miembros/
                echo "Inteligencia:"
                ls inteligencia/